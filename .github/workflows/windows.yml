name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'
          architecture: x64
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Test and package
        shell: pwsh
        run: .\build.ps1 -Python (Get-Command python).Source
      - name: Upload verified Windows release files
        uses: actions/upload-artifact@v7
        with:
          name: PaperMerge-windows-x64
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.sha256
            dist/LICENSE
            dist/README.md
            dist/THIRD_PARTY_NOTICES.txt
          if-no-files-found: error
          retention-days: 14
